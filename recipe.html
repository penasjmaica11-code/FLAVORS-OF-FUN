<head>

    <title>Document</title>
    <style>
    * { 
    margin: 0;
    padding: 0;
    }
    body{
background-image: url('img/class.jpg');
background-repeat: no-repeat;
background-attachment: fixed;
background-size: cover;

}
    /*NAVIGATION*/
nav{
padding-top: 15px;
padding-bottom: 20px;
background-color: #060606;
margin-bottom: 20px;
}
nav ul {
list-style-type: none;
display: flex;
flex-direction: row;
right:10px;
width: 100%;
z-index: 5;
}
nav ul li {
display: inline-block;
margin: 0 5px;
padding: 1em 2em ;
height: 10px;
}
nav ul li a {
    text-decoration: none;
    color: #fff;
    transition: font-size 0.3s ease-in-out; 
  }
  nav ul li a:hover {
    font-size: 1.5em; 
    color: #f966b7;
  }
  nav li:hover, nav li:focus{
    transform: scale(0.5s);
  }
        img{
            height: 130px;
            width: 130px;
            margin: 10px 10px 10px  0px;  
            padding: 0 15px 0 0px;
        }
        .foodimg{
            padding: 20px 20px 20px 20px;
            border: 1px solid #022917;
            background-color: rgb(0, 5, 4);
             margin-top: 10px;
            margin-right: 10px;
            border-radius: 20px;
        }
        div{
            margin: 50px 75px 75px 75px;
            padding:0 0 0 190px;
        }
        .container{
        box-sizing: border-box;
        padding:5px 10px 15px 25px;
        margin-right: 45px;
        margin-left: 45px;
        margin-bottom: 19px;
        background: rgb(5, 56, 44);
        border-radius: 16px;
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        backdrop-filter: blur(11.2px);
        -webkit-backdrop-filter: blur(11.2px);
        border: 1px solid rgba(255, 255, 255, 0.52);
        transition: transform 0.2s;
        }
        .container:hover{
            transform: scale(1.1);
        }
        .container a{
            text-decoration: none;
            color: #fff;
        }
        .flex{
            display: flex;
        }
    </style>
</head>
